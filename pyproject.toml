[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "omni-backend"
version = "0.1.0"
description = "Multi-tenant CRM backend for conversational sales."
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi==0.141.1",
    "starlette==1.6.0",
    "uvicorn[standard]==0.35.0",
    "sqlalchemy[asyncio]==2.0.43",
    "asyncpg==0.30.0",
    "alembic==1.16.5",
    "argon2-cffi==25.1.0",
    "cryptography==50.0.1",
    "pyotp==2.9.0",
    "pydantic==2.11.7",
    "pydantic-settings==2.10.1",
    "celery[redis]==5.5.3",
    "redis==5.2.1",
    "httpx==0.28.1",
]

[project.optional-dependencies]
test = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "aiosqlite==0.21.0",
]
quality = [
    "ruff==0.12.11",
    "mypy==1.17.1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"
