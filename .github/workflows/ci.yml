name: backend-ci

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ".[test,quality]"
      - run: ruff check app tests
      - run: mypy app

  pytest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: omni
          POSTGRES_PASSWORD: omni
          POSTGRES_DB: omni
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U omni -d omni"
          --health-interval=10s --health-timeout=5s --health-retries=5
      redis:
        image: redis:7.4
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .[test]
      - run: alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://omni:omni@localhost:5432/omni
      - run: alembic check
        env:
          DATABASE_URL: postgresql+asyncpg://omni:omni@localhost:5432/omni
      - run: pytest
        env:
          DATABASE_URL: postgresql+asyncpg://omni:omni@localhost:5432/omni
          REDIS_URL: redis://localhost:6379/0

  tenant-isolation:
    runs-on: ubuntu-latest
    needs: pytest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .[test]
      - run: pytest tests/test_tenant_context.py tests/test_authorization.py

  integration:
    runs-on: ubuntu-latest
    needs: pytest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: omni
          POSTGRES_PASSWORD: omni
          POSTGRES_DB: omni
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U omni -d omni"
          --health-interval=10s --health-timeout=5s --health-retries=5
      redis:
        image: redis:7.4
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s --health-timeout=5s --health-retries=5
      mailpit:
        image: axllent/mailpit:v1.27
        ports: ["1025:1025", "8025:8025"]
        options: >-
          --health-cmd="wget --spider -q http://localhost:8025/livez"
          --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .[test]
      - run: alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://omni:omni@localhost:5432/omni
      - run: pytest tests/integration
        env:
          DATABASE_URL: postgresql+asyncpg://omni:omni@localhost:5432/omni
          TEST_DATABASE_URL: postgresql+asyncpg://omni:omni@localhost:5432/omni
          REDIS_URL: redis://localhost:6379/1
          TEST_REDIS_URL: redis://localhost:6379/1
          SMTP_HOST: localhost
          SMTP_PORT: 1025
          TEST_MAILPIT_URL: http://localhost:8025

  fixture-harness:
    runs-on: ubuntu-latest
    needs: pytest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .[test]
      - run: pytest tests/test_meta_fixtures.py

  openapi:
    runs-on: ubuntu-latest
    needs: pytest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .[test]
      - run: PYTHONPATH=. python scripts/validate_openapi.py

  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - run: pip-audit -r requirements.lock --strict --ignore-vuln-file .pip-audit-ignore

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: omni-backend:ci
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: omni-backend:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
